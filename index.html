function checkout(){const it=S.cart.filter(c=>c.sel);if(!it.length)return empty("🛒","Pilih produk di keranjang dulu","Ke Keranjang","go('/cart')");
const t=it.reduce((a,c)=>a+S.prod.find(x=>x.id==c.id).pr*c.q,0)+10000;
return `<h2>Checkout</h2><form class="card" onsubmit="event.preventDefault();order(this)"><label>Alamat<textarea class="f" name="a" required></textarea></label><label>Nomor HP<input class="f" name="h" type="tel" required></label><label>Catatan<input class="f" name="n"></label><label>Metode pembayaran<select class="f" name="m"><option>COD</option><option>Transfer Bank</option><option>E-Wallet</option></select></label><p>Total: <b class="pr">${rp(t)}</b></p><button class="btn o">Buat Pesanan</button></form>`}
function order(f){const it=S.cart.filter(c=>c.sel);const o={no:"WGI-"+Date.now().toString().slice(-6),m:f.m.value,st:f.m.value=="COD"?1:0,n:it.length};S.orders.unshift(o);S.cart=S.cart.filter(c=>!c.sel);S.nt.unshift({i:"📦",t:"Pesanan "+o.no+" dibuat",r:0});sv();toast("Pesanan berhasil dibuat");go("/done")}
const ST=["Menunggu pembayaran","Diproses","Dikirim","Selesai"];
function done(){const o=S.orders[0];if(!o)return empty("📦","Belum ada pesanan","Belanja","go('/marketplace')");
return `<div class="card empty"><div>🎉</div><h2>Pesanan berhasil dibuat 🎉</h2><p>No. pesanan: <b>${o.no}</b></p><p>${ST.map((s,i)=>i<=o.st?`<b>✅ ${s}</b>`:`<span class="mu">○ ${s}</span>`).join("<br>")}</p><p class="mu">Pembayaran online belum aktif; konfirmasi lewat penjual (simulasi).</p><button class="btn" onclick="go('/marketplace')">Lanjut belanja</button></div>`}
function feed(){const l=S.posts.filter(p=>Q.pf=="Semua"||p.g==Q.pf||(Q.pf=="Populer"&&p.l>15));if(Q.pf=="Populer")l.sort((a,b)=>b.l-a.l);
return `<h2>Beranda Komunitas</h2><form class="card" onsubmit="event.preventDefault();post(this)"><textarea class="f" name="t" placeholder="Apa kabar, ${me()}?" required></textarea><div class="row wrap"><select class="f" name="g" style="flex:1"><option>Info Warga</option><option>UMKM</option><option>Event</option><option>Jual Beli</option></select><button class="btn">Posting</button></div></form>
<div class="chips">${["Semua","Terbaru","Populer","UMKM","Info Warga","Event","Jual Beli"].map(c=>`<span class="chip ${Q.pf==c?"on":""}" onclick="Q.pf='${c}';render()">${c}</span>`).join("")}</div>
${l.length?l.map(p=>`<div class="card"><div class="row"><div class="av">${ini(p.u)}</div><div><b>${p.u}</b><div class="mu">${p.g}</div></div></div><p>${p.t}</p><div class="act"><button class="${p.liked?"on":""}" onclick="lk(${p.id})">${p.liked?"❤️":"🤍"} ${p.l+p.liked}</button><button onclick="tc(${p.id})">💬 ${p.cm.length}</button><button onclick="toast('Tautan postingan disalin')">🔗 Bagikan</button><button onclick="bm(${p.id})">${p.saved?"🔖":"📑"}</button><button onclick="rep('Postingan',${p.id})">🚩</button></div><div id="c${p.id}" style="display:none">${p.cm.map(c=>`<p class="mu"><b>${c.u}</b>: ${c.t}</p>`).join("")}<form class="row" onsubmit="event.preventDefault();cm(${p.id},this)"><input class="f" name="t" placeholder="Tulis komentar" required style="margin:0"><button class="btn">Kirim</button></form></div></div>`).join(""):empty("📝","Belum ada postingan")}`}
function post(f){if(need())return;S.posts.unshift({id:Date.now(),u:me(),t:f.t.value,g:f.g.value,l:0,liked:0,saved:0,cm:[]});sv();toast("Postingan berhasil dibuat");render()}
const gp=id=>S.posts.find(p=>p.id==id);
function lk(id){const p=gp(id);p.liked=p.liked?0:1;sv();render()}
function bm(id){const p=gp(id);p.saved=p.saved?0:1;sv();render();toast(p.saved?"Disimpan":"Dihapus dari simpanan")}
function tc(id){const e=$("#c"+id);e.style.display=e.style.display=="none"?"block":"none"}
function cm(id,f){if(need())return;gp(id).cm.push({u:me(),t:f.t.value});sv();render();$("#c"+id).style.display="block";toast("Komentar terkirim")}
function forum(){const l=S.th.filter(t=>t.t.toLowerCase().includes(Q.q.toLowerCase()));
return `<h2>Forum Warga</h2><input class="f" placeholder="Cari thread..." value="${Q.q}" oninput="Q.q=this.value;mp()"><form class="card" onsubmit="event.preventDefault();nth(this)"><input class="f" name="t" placeholder="Judul thread baru" required><select class="f" name="c">${["Informasi Desa","Keamanan","Transportasi","Jual Beli","Lowongan Kerja","Pertanian","Pendidikan","Sosial","Acara Warga","Diskusi Umum"].map(c=>`<option>${c}</option>`).join("")}</select><button class="btn">Buat Thread</button></form>${l.length?l.map(t=>`<div class="card" onclick="go('/forum/${t.id}')" style="cursor:pointer"><b>${t.t}</b><div class="mu">${t.c} · ${t.u} · ${t.rep.length} balasan</div></div>`).join(""):empty("💬","Thread tidak ditemukan")}`}
function nth(f){if(need())return;S.th.unshift({id:Date.now(),t:f.t.value,c:f.c.value,u:me(),f:0,rep:[]});sv();toast("Thread dibuat");render()}
function thread(id){const t=S.th.find(x=>x.id==id);if(!t)return empty("⚠️","Thread tidak ditemukan","Ke Forum","go('/forum')");
return `<div class="card"><h3>${t.t}</h3><div class="mu">${t.c} · ${t.u}</div><div class="act"><button class="${t.f?"on":""}" onclick="S.th.find(x=>x.id==${t.id}).f^=1;sv();render();toast('Status ikuti diubah')">${t.f?"✔ Mengikuti":"Ikuti thread"}</button><button onclick="rep('Thread',${t.id})">🚩 Laporkan</button></div></div>${t.rep.length?t.rep.map(r=>`<div class="card"><b>${r.u}</b><p>${r.t}</p></div>`).join(""):empty("💬","Belum ada balasan")}<form class="card" onsubmit="event.preventDefault();rpl(${t.id},this)"><textarea class="f" name="t" placeholder="Balas..." required></textarea><button class="btn">Balas</button></form>`}
function rpl(id,f){if(need())return;S.th.find(x=>x.id==id).rep.push({u:me(),t:f.t.value});sv();toast("Balasan terkirim");render()}
const evs=l=>l.map(e=>`<div class="card"><h3>${e.t}</h3><div class="mu">📅 ${e.d} · 📍 ${e.l}</div><div class="mu">👥 ${e.n+e.go} peserta</div><div class="act"><button class="${e.go?"on":""}" onclick="rsvp(${e.id})">${e.go?"✔ Ikut":"RSVP / Ikut"}</button><button onclick="toast('Tautan event disalin')">🔗 Bagikan</button></div></div>`).join("");
function rsvp(id){if(need())return;const e=S.ev.find(x=>x.id==id);e.go^=1;sv();render();toast(e.go?"RSVP berhasil":"RSVP dibatalkan")}
function umkm(){return `<h2>UMKM Wargi Dayeuhluhur</h2>${UM.map((u,i)=>`<div class="card row"><div class="av" style="font-size:24px;width:52px;height:52px;border-radius:14px">${u[4]}</div><div style="flex:1"><b>${u[0]}</b><div class="mu">${u[1]} · 📍 Dayeuhluhur · ⭐ ${(4.4+i%6/10).toFixed(1)}</div><div class="mu">${u[2]} Buka ${u[3]}</div><div class="act"><button onclick="Q.q='${u[0].split(" ")[0]}';go('/marketplace')">Lihat Produk</button><button onclick="toast('Fitur hubungi: simulasi (demo)')">Hubungi</button></div></div></div>`).join("")}`}
function chats(){return `<h2>Pesan</h2>${S.ch.length?S.ch.map(c=>`<div class="card row" onclick="go('/chat/${c.id}')" style="cursor:pointer"><div class="av">${ini(c.n)}</div><div style="flex:1"><b>${c.n}</b> ${c.on?"🟢":""}<div class="mu">${c.m[c.m.length-1].t}</div></div>${c.un?`<i class="bdg" style="position:static">${c.un}</i>`:""}</div>`).join(""):empty("💬","Belum ada pesan")}`}
function chatWith(n){if(need())return;let c=S.ch.find(x=>x.n==n);if(!c){c={id:Date.now(),n,on:1,un:0,m:[{me:0,t:"Halo, ada yang bisa dibantu?"}]};S.ch.unshift(c);sv()}go("/chat/"+c.id)}
function chat(id){const c=S.ch.find(x=>x.id==id);if(!c)return empty("⚠️","Percakapan tidak ditemukan","Ke Pesan","go('/chat')");c.un=0;sv();
return `<div class="card"><div class="row"><div class="av">${ini(c.n)}</div><div><b>${c.n}</b><div class="mu">${c.on?"🟢 Online":"Offline"}</div></div></div><div class="msgs" id="ms">${c.m.map(m=>`<div class="m ${m.me?"me":""}">${m.t}</div>`).join("")}</div><form class="row" style="margin-top:8px" onsubmit="event.preventDefault();snd(${c.id},this)"><input class="f" name="t" placeholder="Tulis pesan 😊" required style="margin:0"><button class="btn">Kirim</button></form><p class="mu">Chat ini simulasi di perangkat Anda; belum terhubung ke penjual sungguhan.</p></div>`}
function snd(id,f){const c=S.ch.find(x=>x.id==id);c.m.push({me:1,t:f.t.value});sv();toast("Pesan berhasil dikirim");render();$("#ms").scrollTop=1e5;$("input[name=t]").focus()}
function notif(){return `<div class="row"><h2 style="flex:1">Notifikasi</h2><button class="btn l" onclick="S.nt.forEach(n=>n.r=1);sv();render()">Tandai dibaca</button></div>${S.nt.length?S.nt.map(n=>`<div class="card row" style="${n.r?"":"border-color:var(--b)"}"><span style="font-size:24px">${n.i}</span><span>${n.t}</span></div>`).join(""):empty("🔔","Belum ada notifikasi")}`}
function seller(sub){const mine=S.prod.filter(p=>p.s==me());
if(sub=="new")return `<h2>Tambah Produk</h2><form class="card" onsubmit="event.preventDefault();addp(this)"><input class="f" name="n" placeholder="Nama produk" required><select class="f" name="c">${CATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select><input class="f" name="p" type="number" min="1" placeholder="Harga (Rp)" required><input class="f" name="s" type="number" placeholder="Stok"><textarea class="f" name="d" placeholder="Deskripsi"></textarea><input class="f" name="l" placeholder="Lokasi" value="Dayeuhluhur"><button class="btn g">Publikasikan Produk</button></form>`;
return `<h2>Dashboard Penjual</h2><div class="tabs"><div class="card"><b>${S.orders.length}</b><div class="mu">Pesanan baru</div></div><div class="card"><b>${mine.length}</b><div class="mu">Produk aktif</div></div></div><button class="btn g" onclick="go('/seller/new')">+ Tambah Produk</button><h2>Produk Saya</h2>${mine.length?`<div class="grid">${mine.map(pc).join("")}</div>`:empty("📦","Belum ada produk","Tambah Produk","go('/seller/new')")}`}
function addp(f){if(need())return;S.prod.unshift({id:Date.now(),n:f.n.value,pr:+f.p.value,c:f.c.value,s:me(),r:5,sold:0,e:"🆕",loc:f.l.value||"Dayeuhluhur",d:f.d.value||"Produk baru dari warga."});sv();toast("Produk berhasil dipublikasikan");go("/marketplace")}
function admin(){return `<h2>Admin</h2><div class="tabs"><div class="card"><b>${U.length+1}</b><div class="mu">Pengguna</div></div><div class="card"><b>${S.prod.length}</b><div class="mu">Produk</div></div><div class="card"><b>${S.posts.length}</b><div class="mu">Postingan</div></div><div class="card"><b>${S.reports.length}</b><div class="mu">Laporan</div></div></div><h2>Laporan</h2>${S.reports.length?`<div class="card tw"><table><tr><th>Jenis</th><th>Alasan</th></tr>${S.reports.map(r=>`<tr><td>${r.k} #${String(r.id).slice(-4)}</td><td>${r.r}</td></tr>`).join("")}</table></div>`:empty("🚩","Belum ada laporan")}<p class="mu">Demo: halaman admin terbuka untuk semua; pada versi nyata perlu login peran Admin.</p>`}
function rep(k,id){$("#modal").className="s";$("#modal").innerHTML=`<form class="card" onsubmit="event.preventDefault();S.reports.push({k:'${k}',id:${id},r:this.r.value});sv();$('#modal').className='';toast('Laporan terkirim');render()"><h3>Laporkan ${k}</h3><select class="f" name="r">${["Spam","Penipuan","Konten tidak pantas","Produk ilegal","Informasi palsu","Lainnya"].map(r=>`<option>${r}</option>`).join("")}</select><div class="row"><button class="btn">Kirim</button><button type="button" class="btn l" onclick="$('#modal').className=''">Batal</button></div></form>`}
function login(reg){return `<form class="card" style="max-width:420px;margin:auto" onsubmit="event.preventDefault();S.user=this.n?this.n.value:'Warga Demo';sv();toast('Berhasil masuk');go('/')"><h2>${reg?"Daftar":"Masuk"}</h2>${reg?`<input class="f" name="n" placeholder="Nama" required><input class="f" placeholder="Nomor HP"><select class="f"><option>Pembeli</option><option>Penjual</option><option>UMKM</option></select>`:""}<input class="f" type="email" placeholder="Email" required><input class="f" type="password" placeholder="Password" required><button class="btn" style="width:100%">${reg?"Daftar":"Masuk"}</button><button type="button" class="btn l" style="width:100%;margin-top:8px" onclick="S.user='Warga Demo';sv();toast('Login demo berhasil');go('/')">Login sebagai Demo</button><p class="mu">Autentikasi ini simulasi, belum ada akun nyata. ${reg?'<a href="#/login">Sudah punya akun?</a>':'<a href="#/register">Belum punya akun?</a>'}</p></form>`}
function profile(){if(!S.user)return empty("👤","Anda belum masuk","Masuk","go('/login')");const n=S.posts.filter(p=>p.u==S.user);
return `<div class="card"><div class="row"><div class="av" style="width:64px;height:64px">${ini(S.user)}</div><div><h3>${S.user}</h3><div class="mu">@${S.user.toLowerCase().replace(/ /g,"")} · 📍 Dayeuhluhur</div></div></div><div class="sc"><div class="card" style="margin:0">${n.length}<br><small>Posting</small></div><div class="card" style="margin:0">24<br><small>Followers</small></div><div class="card" style="margin:0">18<br><small>Following</small></div></div><div class="row wrap" style="margin-top:10px"><button class="btn l" onclick="go('/seller')">Dashboard Penjual</button><button class="btn l" onclick="go('/admin')">Admin</button><button class="btn l" onclick="S.user=null;sv();render();toast('Anda keluar')">Keluar</button></div></div><h2>Postingan</h2>${n.length?n.map(p=>`<div class="card">${p.t}</div>`).join(""):empty("📝","Belum ada postingan","Buat postingan","go('/community')")}`}
function search(){const q=Q.q.toLowerCase();const pr=S.prod.filter(p=>p.n.toLowerCase().includes(q)),po=S.posts.filter(p=>p.t.toLowerCase().includes(q)),um=UM.filter(u=>u[0].toLowerCase().includes(q)),f=S.th.filter(t=>t.t.toLowerCase().includes(q));
return `<h2>Cari</h2><input class="f" value="${Q.q}" placeholder="Cari produk, UMKM, postingan, forum..." oninput="Q.q=this.value;mp()">${pr.length+po.length+um.length+f.length?`<h3>Produk (${pr.length})</h3><div class="grid">${pr.slice(0,8).map(pc).join("")}</div><h3>UMKM (${um.length})</h3>${um.map(u=>`<div class="card" onclick="go('/umkm')">${u[4]} ${u[0]}</div>`).join("")}<h3>Postingan (${po.length})</h3>${po.map(p=>`<div class="card">${p.t}</div>`).join("")}<h3>Forum (${f.length})</h3>${f.map(t=>`<div class="card" onclick="go('/forum/${t.id}')">${t.t}</div>`).join("")}`:empty("🔍","Tidak ada hasil")}`}
function route(){const h=(location.hash||"#/").slice(1),[,a,b,c]=h.split("/");
switch(a){case "":case undefined:return home();case "marketplace":return market();case "product":return prod(b);case "cart":return cart();case "checkout":return checkout();case "done":return done();case "community":return feed();case "forum":return b?thread(b):forum();case "events":return `<h2>Event Komunitas</h2>${evs(S.ev)}`;case "umkm":return umkm();case "chat":return b?chat(b):chats();case "notif":return notif();case "seller":return seller(b);case "admin":return admin();case "login":return login(0);case "register":return login(1);case "profile":return profile();case "search":return search();default:return empty("🧭","Halaman tidak ditemukan","Ke Beranda","go('/')")}}
function render(){const x=mk(location.hash.slice(1));$("#app").innerHTML=route();
$("#tn").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${x==mk(n[0])?"on":""}">${n[1]}</a>`).join("")+`<a href="#/seller" class="btn o" style="margin-left:auto;color:#1a1100">Jual Barang</a>`;
$("#bn").innerHTML=BN.map(n=>`<a href="#${n[0]}" class="${x==mk(n[0])?"on":""}"><span>${n[1]}</span>${n[2]}</a>`).join("");
const u=S.nt.filter(n=>!n.r).length;$("#nb").textContent=u||"";$("#nb").style.display=u?"":"none";th()}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});render();
</script></body></html>
